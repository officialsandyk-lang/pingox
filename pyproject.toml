[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pingora-ai"
version = "0.1.0.dev0"
description = "Natural-language Gateway-as-Code CLI for Pingora gateways"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv",]

[project.scripts]
pingora-ai = "pingora_ai.cli:main"

[tool.setuptools.packages.find]
include = [
    "pingora_ai*",
    "core*",
    "agents*",
    "server*"
]
exclude = [
    "generated-pingora-proxy*",
    "tmp*",
    "data*",
    "logs*",
    "docker-bluegreen*",
    "generated-projects*",
    "runtime*"
]
