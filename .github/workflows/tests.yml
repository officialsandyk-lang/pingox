name: Tests
on:
  push:
    branches: [main, private-main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_WORKER_BACKEND: disabled
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_WORKER_BACKEND: disabled
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - run: pip install -r requirements.txt
      - run: python scripts/verify_runtime.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_WORKER_BACKEND: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: bash scripts/verify_compose.sh
